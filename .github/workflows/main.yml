name: copie-repo

on:
  schedule:
    - cron: '0 10 * * *'  # Chaque jour à 10:00 UTC
  workflow_dispatch:  # Permet de déclencher manuellement

jobs:
  copy-branches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: KhalidBougria/OptimasProtect_Blog
          fetch-depth: 0  # Récupère tout l'historique
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git credentials
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add source remote and fetch all branches
        run: |
          git remote add source https://github.com/KhalidBougria/OptimasProtect_Blog.git
          git fetch source --all

      - name: Copy branches to target repository
        run: |
          # Récupérer toutes les branches sauf main du repo source
          BRANCHES=$(git branch -r --list 'source/*' | grep -v 'source/main$' | sed 's|source/||g' | tr -d ' ')
          
          for branch in $BRANCHES; do
            echo "Traitement de la branche: $branch"
            
            # Créer une branche temporaire basée sur la branche source
            git checkout -b temp_$branch source/$branch 2>/dev/null || true
            
            # Rebase sur main
            git rebase origin/main || git rebase --abort
            
            # Force push vers main
            git push origin HEAD:main --force
            
            # Nettoyer et revenir à main
            git checkout main
            git branch -D temp_$branch 2>/dev/null || true
          done
